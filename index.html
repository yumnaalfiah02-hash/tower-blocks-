```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Blocks</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #101828;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(#7dd3fc, #dbeafe 65%, #86efac 65%);
}

/* Matahari */
#sun {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #fde047;
  top: 70px;
  right: 40px;
  box-shadow: 0 0 40px #fde047;
}

/* Score */
#score {
  position: absolute;
  z-index: 10;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 38px;
  font-weight: bold;
  text-shadow: 2px 3px 0 #334155;
}

/* Area tower */
#tower {
  position: absolute;
  width: 100%;
  height: 100%;
  bottom: 0;
}

/* Balok */
.block {
  position: absolute;
  height: 35px;
  border: 2px solid rgba(0,0,0,.15);
  border-radius: 5px;
  box-shadow: inset 0 4px rgba(255,255,255,.25),
              0 3px 5px rgba(0,0,0,.2);
}

/* Tanah */
#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 12px;
  background: #166534;
}

/* Instruksi */
#instruction {
  position: absolute;
  z-index: 10;
  bottom: 30px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 16px;
  text-shadow: 1px 2px 2px #334155;
}

/* Game over */
#gameOver {
  display: none;
  position: absolute;
  z-index: 20;
  inset: 0;
  background: rgba(15,23,42,.75);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
}

#gameOver h1 {
  font-size: 48px;
  margin-bottom: 10px;
}

#finalScore {
  font-size: 24px;
  margin-bottom: 25px;
}

button {
  border: none;
  background: #f97316;
  color: white;
  font-size: 20px;
  font-weight: bold;
  padding: 14px 28px;
  border-radius: 12px;
  box-shadow: 0 5px 0 #c2410c;
  cursor: pointer;
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #c2410c;
}
</style>
</head>

<body>

<div id="game">

  <div id="sun"></div>

  <div id="score">0</div>

  <div id="tower"></div>

  <div id="ground"></div>

  <div id="instruction">
    TAP / KLIK LAYAR UNTUK MENJATUHKAN BALOK
  </div>

  <div id="gameOver">
    <h1>GAME OVER</h1>
    <div id="finalScore">Score: 0</div>
    <button onclick="restartGame()">MAIN LAGI</button>
  </div>

</div>

<script>
const game = document.getElementById("game");
const tower = document.getElementById("tower");
const scoreText = document.getElementById("score");
const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let blocks = [];
let currentBlock = null;

let score = 0;
let gameRunning = true;

let blockWidth = 150;
let blockHeight = 35;

let x = 0;
let direction = 1;
let speed = 4;

let bottom = 12;

const colors = [
  "#ef4444",
  "#f97316",
  "#eab308",
  "#22c55e",
  "#06b6d4",
  "#3b82f6",
  "#8b5cf6",
  "#ec4899"
];

/* Membuat balok baru */
function createBlock() {

  if (!gameRunning) return;

  const block = document.createElement("div");

  block.className = "block";

  block.style.width = blockWidth + "px";
  block.style.background =
    colors[score % colors.length];

  x = 0;
  direction = 1;

  block.style.left = x + "px";
  block.style.bottom = bottom + "px";

  tower.appendChild(block);

  currentBlock = block;
}

/* Animasi balok bergerak */
function moveBlock() {

  if (!gameRunning || !currentBlock) return;

  x += speed * direction;

  const maxX = game.clientWidth - blockWidth;

  if (x >= maxX) {
    x = maxX;
    direction = -1;
  }

  if (x <= 0) {
    x = 0;
    direction = 1;
  }

  currentBlock.style.left = x + "px";

  requestAnimationFrame(moveBlock);
}

/* Menjatuhkan balok */
function dropBlock() {

  if (!gameRunning || !currentBlock) return;

  const currentX = x;

  /* Balok pertama */
  if (blocks.length === 0) {

    blocks.push({
      x: currentX,
      width: blockWidth,
      element: currentBlock
    });

    score++;
    scoreText.textContent = score;

    bottom += blockHeight;

    blockWidth = Math.min(180, blockWidth);

    currentBlock = null;

    createBlock();
    moveBlock();

    return;
  }

  const previous = blocks[blocks.length - 1];

  const left = Math.max(currentX, previous.x);
  const right = Math.min(
    currentX + blockWidth,
    previous.x + previous.width
  );

  const overlap = right - left;

  /* Tidak menempel */
  if (overlap <= 0) {
    endGame();
    return;
  }

  /* Potong bagian balok yang keluar */
  const newWidth = overlap;

  currentBlock.style.left = left + "px";
  currentBlock.style.width = newWidth + "px";

  blocks.push({
    x: left,
    width: newWidth,
    element: currentBlock
  });

  blockWidth = newWidth;

  score++;
  scoreText.textContent = score;

  bottom += blockHeight;

  currentBlock = null;

  createBlock();
  moveBlock();
}

/* Game over */
function endGame() {

  gameRunning = false;

  if (currentBlock) {
    currentBlock.style.background = "#475569";
  }

  finalScore.textContent = "Score: " + score;

  gameOverScreen.style.display = "flex";
}

/* Restart */
function restartGame() {

  blocks.forEach(block => {
    block.element.remove();
  });

  blocks = [];

  score = 0;
  scoreText.textContent = "0";

  blockWidth = 150;
  bottom = 12;

  gameRunning = true;

  gameOverScreen.style.display = "none";

  createBlock();
  moveBlock();
}

/* Kontrol klik */
game.addEventListener("click", function(e) {

  if (
    e.target.tagName === "BUTTON" ||
    e.target.closest("#gameOver")
  ) return;

  dropBlock();

});

/* Kontrol HP */
game.addEventListener("touchstart", function(e) {

  if (
    e.target.tagName === "BUTTON" ||
    e.target.closest("#gameOver")
  ) return;

  e.preventDefault();

  dropBlock();

}, { passive: false });


/* Mulai game */
createBlock();
moveBlock();

</script>

</body>
</html>
